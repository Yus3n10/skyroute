# Deploys as a single Render web service from the Dockerfile.
# COGNODB_URI and COGNODB_PASSWORD are marked sync:false, so Render prompts for
# them in the dashboard and they never live in this repository.
services:
  - type: web
    name: skyroute
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: COGNODB_URI
        sync: false
      - key: COGNODB_PASSWORD
        sync: false
      - key: COGNODB_USER
        value: cognodb
